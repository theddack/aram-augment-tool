# 프로그램 빌드. main 에 올리면 윈도우·맥을 빌드해서 Actions 아티팩트로 남기고,
# 버전 태그(v0.1.0 등)를 붙이면 GitHub 릴리스를 만들고 zip 두 개를 올린다.
#   릴리스: https://github.com/theddack/aram-augment-tool/releases/latest
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8  # 한글 파일 이름 출력 (윈도우 콘솔 기본 인코딩은 한글을 못 씀)

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: python -m pip install pywebview pyinstaller

      - name: 모듈 확인
        run: python -c "import desktop, build_data, champion_data, lol_calc, lcu, overlay, webview, tkinter; print('ok')"

      - name: 빌드
        run: >
          pyinstaller --noconfirm --windowed --name 칼바람증강Addon
          --add-data "web;web" --add-data "rules.json;."
          --hidden-import build_data --hidden-import champion_data --hidden-import lol_calc
          --hidden-import lcu --hidden-import overlay
          desktop.py

      - name: 결과 확인·압축
        shell: pwsh
        run: |
          $exe = "dist/칼바람증강Addon/칼바람증강Addon.exe"
          if (-not (Test-Path $exe)) { throw "exe 없음" }
          if (-not (Get-ChildItem dist/칼바람증강Addon -Recurse -Filter data.json)) { throw "data.json 이 번들에 없음" }
          Copy-Item 사용설명서.md dist/칼바람증강Addon/
          python tools/make_zip.py dist/칼바람증강Addon 칼바람증강Addon-윈도우.zip
          "exe: {0:N1} MB / zip: {1:N1} MB" -f ((Get-Item $exe).Length / 1MB), ((Get-Item 칼바람증강Addon-윈도우.zip).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: 칼바람증강Addon-윈도우.zip
          retention-days: 30

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: python -m pip install pywebview pyinstaller

      - name: 빌드
        run: >
          pyinstaller --noconfirm --windowed --name 칼바람증강Addon
          --osx-bundle-identifier io.github.theddack.aramaugment
          --add-data "web:web" --add-data "rules.json:."
          --hidden-import build_data --hidden-import champion_data --hidden-import lol_calc
          --hidden-import lcu --hidden-import overlay
          desktop.py

      - name: 압축
        run: |
          test -d dist/칼바람증강Addon.app
          ditto -c -k --sequesterRsrc --keepParent dist/칼바람증강Addon.app 칼바람증강Addon-맥.zip
          ls -la 칼바람증강Addon-맥.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: 칼바람증강Addon-맥.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: 칼바람 증강 Addon ${{ github.ref_name }}
          files: |
            out/칼바람증강Addon-윈도우.zip
            out/칼바람증강Addon-맥.zip
          body: |
            ## 받기
            | 컴퓨터 | 파일 |
            |---|---|
            | 윈도우 10/11 | `칼바람증강Addon-윈도우.zip` → 압축 풀고 `칼바람증강Addon.exe` |
            | 맥 (M1~M4) | `칼바람증강Addon-맥.zip` → 압축 풀고 `칼바람증강Addon.app` |

            처음 실행 시 경고가 뜨면 [사용 설명서](https://github.com/theddack/aram-augment-tool/blob/main/사용설명서.md#처음-실행할-때-경고가-뜨면)를 보세요.
            롤 화면 모드는 **테두리 없음**으로 해 주세요.

            라이엇 게임즈와 무관한 팬 제작 도구입니다.
