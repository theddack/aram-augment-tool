# 윈도우 실제 흐름 재현: 가짜 롤 클라이언트·가짜 게임으로 한 판을 돌리며 애드온 창 멈춤·게임 화면 표시를 확인한다.
# 사람이 윈도우에서 한 판 해 보기 전에 여기서 먼저 확인한다. (tools/win_repro.py)
name: windows-repro

on:
  workflow_dispatch:
  push:
    branches: ["repro/**"]

env:
  PYTHONIOENCODING: utf-8

jobs:
  repro:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 게임 창 옆에 작게 띄운 보통 상황: 증강 인식까지 확인
          - settings: '{"geometry": {"w": 420, "h": 500, "x": 1030, "y": 0}}'
            check: --check-ocr
          # 멈춤이 났던 설정: 항상 위
          - settings: '{"on_top": true}'
            check: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: python -m pip install -r requirements-build.txt pillow==11.3.0

      - name: 한 판 재현
        run: python tools/win_repro.py --settings '${{ matrix.settings }}' ${{ matrix.check }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: repro-${{ strategy.job-index }}
          path: repro_out
          retention-days: 7
