# 윈도우 실제 흐름 재현: 가짜 롤 클라이언트·가짜 게임으로 한 판을 돌리며 애드온 창 멈춤·게임 화면 표시를 확인한다.
# 사람이 윈도우에서 한 판 해 보기 전에 여기서 먼저 확인한다. (tools/win_repro.py)
name: windows-repro

on:
  workflow_dispatch:
  push:
    branches: ["repro/**"]

env:
  PYTHONIOENCODING: utf-8

jobs:
  repro:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 게임 창 옆에 작게 띄운 보통 상황: 증강 인식까지 확인
          - settings: '{"geometry": {"w": 420, "h": 500, "x": 1030, "y": 0}}'
            check: --check-ocr
          # 예전 설정 파일에 항상 위가 남아 있어도 무시되는지 (v0.1.14 에서 기능 삭제)
          - settings: '{"on_top": true, "geometry": {"w": 420, "h": 500, "x": 1030, "y": 0}}'
            check: --check-ocr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: python -m pip install -r requirements-build.txt pillow==11.3.0

      - name: 한 판 재현
        run: python tools/win_repro.py --settings '${{ matrix.settings }}' ${{ matrix.check }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: repro-${{ strategy.job-index }}
          path: repro_out
          retention-days: 7

  # '데이터 갱신'을 실제 exe 로: 같은 exe 를 --update-data 로 띄워 받는 방식이 빌드된 프로그램에서도 끝까지 되는지
  update-data:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: python -m pip install -r requirements-build.txt

      - name: 빌드 (릴리스와 같은 옵션)
        run: >
          pyinstaller --noconfirm --windowed --name 칼바람증강Addon
          --add-data "web;web" --add-data "rules.json;."
          --hidden-import build_data --hidden-import champion_data --hidden-import lol_calc
          --hidden-import lcu --hidden-import patch_check --hidden-import overlay --hidden-import augocr
          --collect-all winrt --hidden-import hudicons
          desktop.py

      - name: 데이터 갱신 실행
        shell: pwsh
        run: |
          $exe = "dist/칼바람증강Addon/칼바람증강Addon.exe"
          $p = Start-Process $exe -ArgumentList "--update-data" -PassThru
          if (-not $p.WaitForExit(900000)) { $p.Kill(); "15분 넘게 안 끝남" }
          "종료 코드: $($p.ExitCode)"
          $log = "dist/칼바람증강Addon/data/logs/update.log"
          if (Test-Path $log) { Get-Content $log -Encoding utf8 | Select-Object -Last 40 } else { "update.log 없음" }
          if ($p.ExitCode -ne 0) { exit 1 }
          $d = Get-Content "dist/칼바람증강Addon/data/web/data.json" -Raw -Encoding utf8 | ConvertFrom-Json
          "받은 데이터: 챔피언 $($d.champions.Count) · 증강 $($d.augments.Count) · 피해 유형 있음 $(@($d.champions | Where-Object { $_.damageType }).Count)"
