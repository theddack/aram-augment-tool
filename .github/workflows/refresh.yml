# 매일 데이터 자동 갱신: 게임 데이터·위키·패치 노트를 새로 받아서 실제로 바뀌었을 때만 반영하고 사이트를 다시 배포한다.
# 하루 1번 (서버에 부담이 없는 빈도). 승률 통계 사이트는 수집하지 않는다.
name: refresh

on:
  schedule:
    - cron: "0 18 * * *"  # 매일 03:00 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: 데이터 새로 받기
        run: |
          cp web/data.json /tmp/old.json
          python build_data.py --refresh
          python tools/changelog.py html

      - name: 바뀌었는지 확인
        id: diff
        run: |
          if python tools/data_changed.py /tmp/old.json web/data.json; then echo "changed=1" >> "$GITHUB_OUTPUT"; fi

      - name: 저장소에 반영
        if: steps.diff.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web
          git commit -m "data: 자동 갱신 $(python -c "import json;d=json.load(open('web/data.json'));print(d['version'], d['builtAt'])")"
          git push

      # 새 증강·설명 변경·패치 노트 숫자 불일치·규칙 경고가 있으면 '데이터 확인' 이슈를 만들거나 내용을 바꾼다
      - name: 확인 필요 이슈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s web/review.md ]; then echo "확인할 것 없음"; exit 0; fi
          gh label create "데이터 확인" --color c8aa6e --description "매일 갱신이 찾은 확인 필요 항목" --force
          title="$(head -1 web/review.md | sed 's/^# //')"
          num=$(gh issue list --label "데이터 확인" --state open --json number,title -q ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then gh issue edit "$num" --body-file web/review.md; else gh issue create --title "$title" --label "데이터 확인" --body-file web/review.md; fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
        if: steps.diff.outputs.changed == '1'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: steps.diff.outputs.changed == '1'
        with:
          path: web
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
        if: steps.diff.outputs.changed == '1'
